name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署，排队而不取消进行中的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 自检（node test.js）
        run: node test.js

      - name: 准备静态站点（只发布运行所需文件）
        run: |
          mkdir -p _site
          cp index.html favicon.ico _site/
          cp -r img _site/
          echo "站点文件："
          find _site -type f | sort

      # 说明：仓库需先在 Settings → Pages 把 Source 设为「GitHub Actions」（一次性操作）。
      # 这里不传 enablement: true —— GITHUB_TOKEN 权限不足以自动创建 Pages 站点，会直接报错。
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
